[project]
name = "thunk"
version = "0.1.1"
description = "Generate automatic save and load methods for functions that manipulate arrays"
readme = "README.md"
license = "MIT"
authors = [
    { name = "binado", email = "bernardopveronese@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.3",
    "platformdirs>=4.0",
    "pydantic>=2.13.5",
]
license-files = ["LICENSE"]
keywords = ["hdf5", "json", "numpy", "persistence", "serialization", "type-annotations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/binado/thunk"
Repository = "https://github.com/binado/thunk.git"
Issues = "https://github.com/binado/thunk/issues"

[project.optional-dependencies]
jax = [
    "jax>=0.11.2",
]


[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jax>=0.11.2",
    "prek>=0.5.3",
    "ruff>=0.16.0",
    "ty>=0.0.83",
    { include-group = "test" },
]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.src]
include = ["src", "tests"]
